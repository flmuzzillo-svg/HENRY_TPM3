<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Agent RAG Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <span class="icon">🤖</span>
                <h1>RAG Assistant</h1>
            </div>
            <div class="status-badge">Sistema Multidisciplinario</div>
        </header>
        
        <main id="chat-container">
            <div class="message system">
                <div class="bubble">
                    ¡Hola! Soy tu asistente inteligente. Puedo ayudarte con consultas de **Recursos Humanos**, **Tecnología** y **Finanzas**.
                </div>
            </div>
        </main>
        
        <footer>
            <form id="chat-form">
                <input type="text" id="user-input" placeholder="Escribe tu consulta aquí..." autocomplete="off">
                <button type="submit" id="send-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </form>
        </footer>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
